name: concord

services:
  concord:
    build: .
    image: concord-server:latest
    container_name: concord
    restart: unless-stopped
    # Rede do host: o WebRTC (UDP 7882) funciona sem NAT extra do Docker
    network_mode: host
    # Downloads (concord.exe, app.zip, app.asar, version.json) ficam fora da imagem:
    # basta trocar os arquivos nessa pasta para publicar uma versão nova
    volumes:
      - /DATA/AppData/concord/server/public:/app/server/public
    environment:
      PORT: "3456"
      # IP do servidor na rede (ou IP público/domínio se amigos entrarem de fora)
      SERVER_URL: "192.168.15.8"
      LIVEKIT_PORT: "7880"
      LIVEKIT_TCP_PORT: "7881"
      LIVEKIT_UDP_PORT: "7882"
      LIVEKIT_NODE_IP: "192.168.15.8"
      # Sinalização do LiveKit pelo Cloudflare Tunnel (livekit.fredsmusic.space -> localhost:7880)
      LIVEKIT_URL: "wss://livekit.fredsmusic.space"
      LIVEKIT_USE_EXTERNAL_IP: "false"
      # Só IPv4 para mídia (o IPv6 do ZimaOS não aceita bind e derruba o LiveKit)
      LIVEKIT_IPS_INCLUDE: "0.0.0.0/0"

# Metadados para o ZimaOS/CasaOS mostrar o Concord como app na tela inicial
x-casaos:
  architectures:
    - amd64
    - arm64
  main: concord
  author: Gustavo Amaro
  developer: Gustavo Amaro
  category: Chat
  title:
    en_us: Concord
  tagline:
    en_us: Servidor de voz, tela e chat do Concord
  description:
    en_us: Servidor do Concord (socket.io + LiveKit SFU) para chamadas de voz, transmissão de tela e chat.
  icon: http://192.168.15.8:3456/download/icon.png
  scheme: http
  port_map: "3456"
  index: /
  store_app_id: concord
